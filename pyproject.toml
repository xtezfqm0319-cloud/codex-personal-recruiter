[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-personal-recruiter"
version = "0.11.0"
description = "Local Markdown-first recruiting workbench for Codex and Claude Code"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=4.0",
  "PyMuPDF>=1.24",
  "rapidocr-onnxruntime>=1.4",
  "python-docx>=1.1",
  "charset-normalizer>=3.3",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recruiter = "recruiter.cli:main"

[tool.setuptools]
package-dir = {"" = "06_系统"}

[tool.setuptools.packages.find]
where = ["06_系统"]

[tool.setuptools.package-data]
recruiter = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["06_系统/tests"]
addopts = "-q"
